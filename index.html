<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE SCORE PASUKAN LKBB LASKAR 9</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <!-- FontAwesome untuk Icon IG & WA -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #090c10;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px 20px 10px 20px;
      overflow-x: hidden;
    }

    /* HEADER DESKTOP / PROYEKTOR */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 2px solid rgba(5, 244, 255, 0.4);
      padding-bottom: 12px;
      box-shadow: 0 4px 15px rgba(5, 244, 255, 0.1);
    }

    .logo-container {
      width: 95px;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 6px rgba(5, 244, 255, 0.3));
    }

    .header-center {
      text-align: center;
      flex: 1;
      padding: 0 10px;
    }

    /* GRADASI JUDUL DILEMBUTKAN (COLOR PALETTE SAMA) */
    header h1 {
      font-family: 'Teko', sans-serif;
      font-size: 3.3rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #05F4FF 20%, #FFDB05 50%, #FF05A7 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      text-shadow: 0 0 10px rgba(5, 244, 255, 0.2);
    }

    /* PROMOSI DIBAWAH JUDUL (DIPERBESAR + EFEK BERPENDAR SESEKALI) */
    .sub-credit-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-top: 6px;
      font-size: 0.88rem; /* Ukuran diperbesar */
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 0.5px;
      animation: glow-pulse 4s infinite ease-in-out; /* Efek Pendar Sesekali */
    }

    .sub-credit-bar strong {
      color: rgba(255, 255, 255, 0.9);
    }

    .sub-credit-bar .divider {
      color: rgba(255, 255, 255, 0.25);
    }

    .sub-credit-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* ANIMASI BERPENDAR (GLOW PULSE) SESEKALI */
    @keyframes glow-pulse {
      0%, 100% {
        text-shadow: 0 0 2px rgba(255, 255, 255, 0.1);
        opacity: 0.65;
      }
      50% {
        text-shadow: 0 0 12px rgba(5, 244, 255, 0.7), 0 0 18px rgba(255, 5, 167, 0.5);
        opacity: 1;
        color: #ffffff;
      }
    }

    /* BARIS 2: GABUNGAN LIVE + JAM DIGITAL DALAM 1 TAMPILAN */
    .header-info-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 8px;
    }

    .combined-live-clock {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: rgba(17, 22, 29, 0.8);
      border: 1px solid rgba(66, 125, 128, 0.6);
      padding: 3px 14px;
      border-radius: 20px;
      box-shadow: 0 0 10px rgba(5, 244, 255, 0.15);
    }

    .status-badge {
      color: #FF05A7;
      font-weight: bold;
      font-size: 0.85rem;
      animation: pulse 1.5s infinite;
    }

    .clock-display {
      font-family: 'Teko', sans-serif;
      font-size: 1.35rem;
      color: #05F4FF;
      letter-spacing: 1px;
      line-height: 1;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    /* GRID & CARDS */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex: 1;
    }

    .category-card {
      background: #11161d;
      border-radius: 12px;
      border: 1px solid rgba(66, 125, 128, 0.5);
      padding: 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    /* GRADASI JUDUL KATEGORI DILEMBUTKAN */
    .category-title {
      font-family: 'Teko', sans-serif;
      font-size: 2rem;
      text-align: center;
      padding: 6px;
      margin-bottom: 12px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .purna-title { 
      background: linear-gradient(135deg, #c41888 0%, #6e2254 100%); 
      color: #ffffff; 
      box-shadow: 0 0 8px rgba(255, 5, 167, 0.25);
    }
    .smp-title { 
      background: linear-gradient(135deg, #05bccc 0%, #295456 100%); 
      color: #ffffff; 
      box-shadow: 0 0 8px rgba(5, 244, 255, 0.25);
    }
    .sma-title { 
      background: linear-gradient(135deg, #d6b809 0%, #75295b 100%); 
      color: #ffffff; 
      box-shadow: 0 0 8px rgba(255, 219, 5, 0.25);
    }

    .score-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 70vh;
      padding-right: 4px;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a202c;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 4px solid #427D80;
      transition: all 0.4s ease;
    }

    .rank-1 { 
      border-left-color: #FFDB05; 
      background: rgba(255, 219, 5, 0.1); 
      box-shadow: inset 0 0 10px rgba(255, 219, 5, 0.15);
    }
    .rank-2 { 
      border-left-color: #05F4FF; 
      background: rgba(5, 244, 255, 0.08); 
    }
    .rank-3 { 
      border-left-color: #FF05A7; 
      background: rgba(255, 5, 167, 0.08); 
    }

    .team-info {
      display: flex;
      align-items: center;
      flex: 1;
      overflow: hidden;
    }

    .rank-badge {
      min-width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #222936;
      font-size: 1.1rem;
      font-weight: bold;
      margin-right: 10px;
      flex-shrink: 0;
    }

    .rank-1 .rank-badge { background: #FFDB05; color: #000; font-size: 1.3rem; }
    .rank-2 .rank-badge { background: #05F4FF; color: #000; font-size: 1.3rem; }
    .rank-3 .rank-badge { background: #FF05A7; color: #fff; font-size: 1.3rem; }

    .team-name-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow: hidden;
      flex: 1;
    }

    /* NAMA SEKOLAH DIBERBESAR 1-2 POIN (1.1rem) */
    .team-name {
      font-size: 1.1rem; /* Naik dari 0.95rem */
      font-weight: 700;
      white-space: normal;
      word-break: break-word;
      line-height: 1.2;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* INDIKATOR SEGITIGA BERKEDIP */
    .trend-icon {
      font-size: 1.1rem;
      font-weight: bold;
      margin-left: 4px;
      display: inline-block;
      flex-shrink: 0;
      animation: blink 1s infinite ease-in-out;
    }

    .trend-up {
      color: #00FF66;
      text-shadow: 0 0 8px rgba(0, 255, 102, 0.8);
    }

    .trend-down {
      color: #FF0055;
      text-shadow: 0 0 8px rgba(255, 0, 85, 0.8);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1.1); }
      50% { opacity: 0.2; transform: scale(0.9); }
    }

    .score-points {
      font-family: 'Teko', sans-serif;
      font-size: 2rem;
      color: #05F4FF;
      margin-left: 10px;
      text-shadow: 0 0 8px rgba(5, 244, 255, 0.5);
      flex-shrink: 0;
    }

    .loading-text {
      text-align: center;
      color: #427D80;
      padding: 20px;
      font-size: 1rem;
    }

    /* RESPONSIF KHUSUS HP (MOBILE) */
    @media (max-width: 900px) {
      body {
        padding: 10px;
      }

      header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding-bottom: 8px;
      }

      .logo-container {
        width: 50px;
        height: 50px;
      }

      header h1 {
        font-size: 1.35rem;
        letter-spacing: 1px;
      }

      .sub-credit-bar {
        font-size: 0.72rem;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 4px;
      }

      .sub-credit-bar .divider {
        display: none;
      }

      .combined-live-clock {
        padding: 2px 10px;
        gap: 6px;
      }

      .status-badge {
        font-size: 0.72rem;
      }

      .clock-display {
        font-size: 1.05rem;
      }

      .grid-container {
        grid-template-columns: 1fr;
        gap: 15px;
      }

      .category-title {
        font-size: 1.6rem;
      }

      .score-list {
        max-height: 350px;
      }

      .team-name {
        font-size: 1.0rem; /* Naik dari 0.88rem di HP */
      }

      .score-points {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <!-- Logo Kiri -->
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1NmIy6BaFBKj6Yd8bPSC7dpV9dl7h08FR" alt="Logo Kiri" class="logo-img">
    </div>

    <!-- Judul Tengah, Promosi & Jam -->
    <div class="header-center">
      <h1>LIVE BEST PASUKAN LKBB LASKAR 9</h1>
      
      <!-- BARIS 1: PROMOSI (DIPERBESAR & EFEK GLOWING) -->
      <div class="sub-credit-bar">
        <span class="sub-credit-item">dibuat oleh <strong>Rekap Andalan</strong></span>
        <span class="divider">|</span>
        <span class="sub-credit-item"><i class="fab fa-instagram"></i> tjobrut.store | cosmo.atribut</span>
        <span class="divider">|</span>
        <span class="sub-credit-item"><i class="fab fa-whatsapp"></i> 0896-9402-4600</span>
      </div>

      <!-- BARIS 2: GABUNGAN LIVE + JAM DIGITAL -->
      <div class="header-info-bar">
        <div class="combined-live-clock">
          <span class="status-badge">● LIVE</span>
          <span class="clock-display" id="realtime-clock">00:00:00 WIB</span>
        </div>
      </div>
    </div>

    <!-- Logo Kanan -->
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0" alt="Logo Kanan" class="logo-img">
    </div>
  </header>

  <div class="grid-container">
    <div class="category-card">
      <div class="category-title purna-title">PURNA / MANAGEMENT</div>
      <div class="score-list" id="list-purna">
        <div class="loading-text">Memuat data...</div>
      </div>
    </div>

    <div class="category-card">
      <div class="category-title smp-title">SMP / MTS</div>
      <div class="score-list" id="list-smp">
        <div class="loading-text">Memuat data...</div>
      </div>
    </div>

    <div class="category-card">
      <div class="category-title sma-title">SMA / SMK / MA</div>
      <div class="score-list" id="list-sma">
        <div class="loading-text">Memuat data...</div>
      </div>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbxxvkMipIor8MDUFZlex8V6tCGjGn450M4yWF0zqB4HNP5bw0EbTe0X_Bjl6vre42zm/exec";

    // Menyimpan posisi peringkat sebelumnya & status tren permanen
    let previousRanks = { purna: {}, smp: {}, sma: {} };
    let activeTrends = { purna: {}, smp: {}, sma: {} };

    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('realtime-clock').innerText = `${hours}:${minutes}:${seconds} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function renderCategory(catKey, containerId, items) {
      const container = document.getElementById(containerId);
      if (!items || items.length === 0) {
        container.innerHTML = '<div class="loading-text">Belum Ada Data</div>';
        return;
      }

      let html = '';
      let newRankState = {};

      items.forEach((item, index) => {
        const currentRank = index + 1;
        const teamName = item.nama;
        newRankState[teamName] = currentRank;

        // Mengecek apakah peringkat berubah
        if (previousRanks[catKey] && previousRanks[catKey][teamName] !== undefined) {
          const oldRank = previousRanks[catKey][teamName];
          if (currentRank < oldRank) {
            activeTrends[catKey][teamName] = 'up';   // Naik peringkat
          } else if (currentRank > oldRank) {
            activeTrends[catKey][teamName] = 'down'; // Turun peringkat
          }
        }

        // Tampilkan hanya simbol segitiga berkedip
        let trendHtml = '';
        if (activeTrends[catKey] && activeTrends[catKey][teamName] === 'up') {
          trendHtml = `<span class="trend-icon trend-up" title="Peringkat Naik">▲</span>`;
        } else if (activeTrends[catKey] && activeTrends[catKey][teamName] === 'down') {
          trendHtml = `<span class="trend-icon trend-down" title="Peringkat Turun">▼</span>`;
        }

        let rankBadgeContent = currentRank;
        let rankClass = '';
        if (currentRank === 1) { rankBadgeContent = '🥇'; rankClass = 'rank-1'; }
        else if (currentRank === 2) { rankBadgeContent = '🥈'; rankClass = 'rank-2'; }
        else if (currentRank === 3) { rankBadgeContent = '🥉'; rankClass = 'rank-3'; }

        html += `
          <div class="score-item ${rankClass}">
            <div class="team-info">
              <div class="rank-badge">${rankBadgeContent}</div>
              <div class="team-name-wrapper">
                <div class="team-name" title="${teamName}">${teamName}</div>
                ${trendHtml}
              </div>
            </div>
            <div class="score-points">${item.poin}%</div>
          </div>
        `;
      });

      // Simpan riwayat peringkat saat ini
      previousRanks[catKey] = newRankState;
      container.innerHTML = html;
    }

    async function updateDashboard() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) throw new Error("Gagal mengambil data");
        const data = await response.json();
        
        if (data) {
          renderCategory('purna', 'list-purna', data.purna);
          renderCategory('smp', 'list-smp', data.smp);
          renderCategory('sma', 'list-sma', data.sma);
        }
      } catch (err) {
        console.error("Gagal mengambil data:", err);
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 2000);
  </script>

</body>
</html>
