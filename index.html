<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIVE SCORE PASUKAN LASKAR 9</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <style>
    /* PALET WARNA PILIHAN:
       #FF05A7 (Neon Magenta/Pink)
       #05F4FF (Neon Cyan)
       #FFDB05 (Neon Gold/Yellow)
       #AA3C84 (Purple)
       #427D80 (Dark Teal)
    */

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: #090c10;
      color: #ffffff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px 20px;
      overflow-x: hidden;
    }

    /* HEADER LAYOUT */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
      border-bottom: 3px solid #05F4FF;
      padding-bottom: 10px;
      box-shadow: 0 4px 15px rgba(5, 244, 255, 0.2);
    }

    .logo-container {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 8px rgba(5, 244, 255, 0.4));
    }

    .header-center {
      text-align: center;
      flex: 1;
    }

    header h1 {
      font-family: 'Teko', sans-serif;
      font-size: 3.5rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #05F4FF 0%, #FFDB05 50%, #FF05A7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      text-shadow: 0 0 15px rgba(255, 5, 167, 0.3);
    }

    .header-info-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      margin-top: 6px;
    }

    .status-badge {
      background: rgba(255, 5, 167, 0.2);
      border: 1px solid #FF05A7;
      color: #FF05A7;
      padding: 2px 10px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      animation: pulse 1.5s infinite;
    }

    .clock-display {
      font-family: 'Teko', sans-serif;
      font-size: 1.4rem;
      color: #05F4FF;
      letter-spacing: 1px;
      background: rgba(66, 125, 128, 0.3);
      border: 1px solid #427D80;
      padding: 0px 12px;
      border-radius: 6px;
    }

    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* GRID & CARDS */
    .grid-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      flex: 1;
    }

    .category-card {
      background: #11161d;
      border-radius: 12px;
      border: 1px solid #427D80;
      padding: 15px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }

    .category-title {
      font-family: 'Teko', sans-serif;
      font-size: 2rem;
      text-align: center;
      padding: 6px;
      margin-bottom: 12px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    /* TEMA WARNA JUDUL KATEGORI */
    .purna-title { 
      background: linear-gradient(135deg, #FF05A7 0%, #AA3C84 100%); 
      color: #ffffff; 
      box-shadow: 0 0 10px rgba(255, 5, 167, 0.4);
    }
    .smp-title { 
      background: linear-gradient(135deg, #05F4FF 0%, #427D80 100%); 
      color: #000000; 
      box-shadow: 0 0 10px rgba(5, 244, 255, 0.4);
    }
    .sma-title { 
      background: linear-gradient(135deg, #FFDB05 0%, #AA3C84 100%); 
      color: #000000; 
      box-shadow: 0 0 10px rgba(255, 219, 5, 0.4);
    }

    .score-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      max-height: 70vh;
      padding-right: 4px;
    }

    .score-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1a202c;
      padding: 10px 14px;
      border-radius: 8px;
      border-left: 4px solid #427D80;
      transition: all 0.4s ease;
    }

    /* TOP 3 STYLING DENGAN MEDALI */
    .rank-1 { 
      border-left-color: #FFDB05; 
      background: rgba(255, 219, 5, 0.12); 
      box-shadow: inset 0 0 12px rgba(255, 219, 5, 0.2);
    }
    .rank-2 { 
      border-left-color: #05F4FF; 
      background: rgba(5, 244, 255, 0.1); 
    }
    .rank-3 { 
      border-left-color: #FF05A7; 
      background: rgba(255, 5, 167, 0.1); 
    }

    .team-info {
      display: flex;
      align-items: center;
      flex: 1;
      overflow: hidden;
    }

    .rank-badge {
      min-width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #222936;
      font-size: 1.1rem;
      font-weight: bold;
      margin-right: 12px;
    }

    .rank-1 .rank-badge { background: #FFDB05; color: #000; font-size: 1.3rem; }
    .rank-2 .rank-badge { background: #05F4FF; color: #000; font-size: 1.3rem; }
    .rank-3 .rank-badge { background: #FF05A7; color: #fff; font-size: 1.3rem; }

    .team-name-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
    }

    .team-name {
      font-size: 1.1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* INDIKATOR TREN NAIK / TURUN */
    .trend-icon {
      font-size: 0.9rem;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      padding: 1px 5px;
      border-radius: 4px;
      animation: popIn 0.5s ease;
    }

    .trend-up {
      color: #00FF66;
      background: rgba(0, 255, 102, 0.15);
      border: 1px solid #00FF66;
    }

    .trend-down {
      color: #FF0055;
      background: rgba(255, 0, 85, 0.15);
      border: 1px solid #FF0055;
    }

    @keyframes popIn {
      0% { transform: scale(0); }
      80% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .score-points {
      font-family: 'Teko', sans-serif;
      font-size: 2rem;
      color: #05F4FF;
      margin-left: 10px;
      text-shadow: 0 0 8px rgba(5, 244, 255, 0.5);
    }
  </style>
</head>
<body>

  <header>
    <!-- Logo Kiri -->
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1NmIy6BaFBKj6Yd8bPSC7dpV9dl7h08FR" alt="Logo Kiri" class="logo-img">
    </div>

    <!-- Judul Tengah & Jam -->
    <div class="header-center">
      <h1>LIVE BEST PASUKAN LASKAR 9</h1>
      <div class="header-info-bar">
        <div class="status-badge">● LIVE</div>
        <div class="clock-display" id="realtime-clock">00:00:00 WIB</div>
      </div>
    </div>

    <!-- Logo Kanan -->
    <div class="logo-container">
      <img src="https://lh3.googleusercontent.com/d/1UHSI3CLB0YCZ7uQ3O0sVIGMrVeK7qrK0" alt="Logo Kanan" class="logo-img">
    </div>
  </header>

  <div class="grid-container">
    <div class="category-card">
      <div class="category-title purna-title">PURNA / MANAGEMENT</div>
      <div class="score-list" id="list-purna"></div>
    </div>

    <div class="category-card">
      <div class="category-title smp-title">SMP / MTS</div>
      <div class="score-list" id="list-smp"></div>
    </div>

    <div class="category-card">
      <div class="category-title sma-title">SMA / SMK / MA</div>
      <div class="score-list" id="list-sma"></div>
    </div>
  </div>

  <script>
    // URL API GOOGLE APPS SCRIPT ANDA
    const API_URL = "https://script.google.com/macros/s/AKfycbw1dAZmjaXDqCXOPGxXA1-hqwe-1-SOiPGPbT_KyVbBGKxa9iNIP8c4UBKqxNjsZc_i/exec";

    // Variabel untuk menyimpan histori peringkat sebelumnya (untuk fitur Naik/Turun)
    let previousRanks = {
      purna: {},
      smp: {},
      sma: {}
    };

    // 1. FUNGSI JAM REALTIME
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('realtime-clock').innerText = `${hours}:${minutes}:${seconds} WIB`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. FUNGSI RENDER TAMPILAN KATEGORI
    function renderCategory(catKey, containerId, items) {
      const container = document.getElementById(containerId);
      if (!items || items.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: #427D80; padding: 20px;">Belum Ada Data</div>';
        return;
      }

      let html = '';
      let newRankState = {};

      items.forEach((item, index) => {
        const currentRank = index + 1;
        const teamName = item.nama;
        newRankState[teamName] = currentRank;

        // Logika Indikator Naik / Turun
        let trendHtml = '';
        if (previousRanks[catKey] && previousRanks[catKey][teamName] !== undefined) {
          const oldRank = previousRanks[catKey][teamName];
          if (currentRank < oldRank) {
            // Peringkat membaik (Angka peringkat lebih kecil) -> NAIK
            trendHtml = `<span class="trend-icon trend-up">▲ Naik</span>`;
          } else if (currentRank > oldRank) {
            // Peringkat memburuk (Angka peringkat lebih besar) -> TURUN
            trendHtml = `<span class="trend-icon trend-down">▼ Turun</span>`;
          }
        }

        // Logika Medali untuk Juara 1, 2, 3
        let rankBadgeContent = currentRank;
        let rankClass = '';
        if (currentRank === 1) {
          rankBadgeContent = '🥇';
          rankClass = 'rank-1';
        } else if (currentRank === 2) {
          rankBadgeContent = '🥈';
          rankClass = 'rank-2';
        } else if (currentRank === 3) {
          rankBadgeContent = '🥉';
          rankClass = 'rank-3';
        }

        html += `
          <div class="score-item ${rankClass}">
            <div class="team-info">
              <div class="rank-badge">${rankBadgeContent}</div>
              <div class="team-name-wrapper">
                <div class="team-name" title="${teamName}">${teamName}</div>
                ${trendHtml}
              </div>
            </div>
            <div class="score-points">${item.poin}</div>
          </div>
        `;
      });

      // Simpan posisi peringkat saat ini untuk pembandingan berikutnya
      previousRanks[catKey] = newRankState;
      container.innerHTML = html;
    }

    // 3. FUNGSI FETCH DATA REALTIME
    async function updateDashboard() {
      try {
        const response = await fetch(API_URL);
        const data = await response.json();
        
        if (data) {
          renderCategory('purna', 'list-purna', data.purna);
          renderCategory('smp', 'list-smp', data.smp);
          renderCategory('sma', 'list-sma', data.sma);
        }
      } catch (err) {
        console.error("Gagal mengambil data:", err);
      }
    }

    updateDashboard();
    setInterval(updateDashboard, 2000); // Tarik data baru tiap 2 detik
  </script>

</body>
</html>
